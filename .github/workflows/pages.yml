# Deploys web/dist/gcode-sim-web.html to https://aryaa94.github.io/G-Code/
# after checking it end to end against the native CLI. Uses the committed
# file, so rebuild it with web/build_web.sh before pushing.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy web tool to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the native CLI (the reference the page is compared with)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGCODESIM_BUILD_TESTS=OFF -DGCODESIM_BUILD_BENCH=OFF
          cmake --build build -j 4 --target gcode-sim
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: End-to-end test of the page to be deployed
        working-directory: web/tests
        run: |
          npm install
          npx playwright install --with-deps chromium
          node ui_test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stage the page as index.html
        run: |
          mkdir -p _site
          cp web/dist/gcode-sim-web.html _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
